[pytest]
# Pytest configuration for Stock_ML project

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = Tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes

# Minimum Python version
minversion = 3.8

# Markers for categorizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    dashboard: marks tests for dashboard functionality
    data: marks tests for data processing

# Coverage options (when using pytest-cov)
[coverage:run]
source = src, Dashboard
omit = 
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Ignore warnings from specific libraries
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
